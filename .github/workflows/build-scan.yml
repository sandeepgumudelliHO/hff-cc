name: Building and scanning Docker images

on:
    push:
        branches:
            - master
            - CCC-*
jobs:
    build-scan:
        uses: UKHomeOffice/core-cloud-workflow-docker-actions/.github/workflows/build-scan.yml@1.3.0
        with:
            working_directory: "."
            dockerfile: "Dockerfile"
            image_name: "hof-feedback-form"
            image_tag: "latest"
            tag_latest: true