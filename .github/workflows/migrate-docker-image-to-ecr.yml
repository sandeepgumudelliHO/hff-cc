name: Tenant Migration Example - Docker

on:
  push:
        branches:
            - CCL-*
  workflow_dispatch:
    inputs:
      runner_target:
        description: Runner target for migration
        required: false
        type: choice
        options:
          - ubuntu-latest
          - self-hosted
        default: ubuntu-latest
jobs:
  migrate_docker:
    permissions:
        contents: read
        id-token: write
    uses: UKHomeOffice/core-cloud-migration-playbook/.github/workflows/migrate-artifacts.yml@CCL-10136
    with:
      package_type: docker
      artifact_names: acp-ca
      jfrog_repository: artifactory-internal
      target_repository: acp-ca
      aws_region: eu-west-2
      runner_labels_json: ${{ github.event_name == 'workflow_dispatch' && inputs.runner_target == 'self-hosted' && '["self-hosted"]' || '["ubuntu-latest"]' }}
      #codeartifact_domain: enterprise-domain
      #codeartifact_owner: "123456789012"
    secrets:
      target_role_to_assume: ${{ secrets.TARGET_ROLE_TO_ASSUME }}
      jfrog_url: ${{ secrets.JFROG_URL }}/ui/repos/tree/General/artifactory-internal/acp-ca/*
      jfrog_docker_registry: ${{ secrets.JFROG_DOCKER_REGISTRY }}
